<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安怡宝宝的18岁</title>
    <style>
        :root {
            --apple-font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            --bg-base: #f8f4f6;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(229, 164, 181, 0.25);
            --text-dark: #1d1d1f;
            --text-gray: #86868b;
            --accent-pink: #d88ea4;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--apple-font);
            background-color: var(--bg-base);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* 极简高级毛玻璃导航栏 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 48px;
            background: rgba(248, 244, 246, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            border-bottom: 1px solid var(--glass-border);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 32px;
            padding: 0;
            margin: 0;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--accent-pink);
        }

        /* 容器排版 */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 90px 20px 40px 20px;
        }

        /* 首屏 Hero 区域 */
        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #1d1d1f, #d88ea4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-gray);
            margin-bottom: 30px;
        }

        .hero-img {
            width: 100%;
            max-width: 900px;
            height: 420px;
            border-radius: 24px;
            background: url('./52915dd2d34b30acc1c24ec513701e_livephoto.jpeg') center/cover;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            border: 1px solid var(--glass-border);
        }

        /* Bento 布局 */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .bento-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            overflow: hidden;
            position: relative;
        }

        .bento-col-6 { grid-column: span 6; }

        .bento-card h2 {
            font-size: 2.2rem;
            font-weight: 600;
            margin: 0 0 14px 0;
            letter-spacing: -0.02em;
        }

        .bento-card p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-gray);
            margin: 0;
        }

        .media-box {
            width: 100%;
            height: 340px;
            border-radius: 18px;
            background-size: cover;
            background-position: center;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
        }

        .img-cat-bg { background-image: url('./image_f5541bcac111f3aa3ec744526eba46bf.jpeg'); }
        .img-baby-bg { background-image: url('./lp_image.jpeg'); }

        /* 画廊网格 */
        .gallery-section {
            margin-top: 40px;
        }

        .gallery-section h2 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .gallery-item {
            height: 280px;
            border-radius: 20px;
            background-size: cover;
            background-position: center;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.02);
        }

        .gallery-item:nth-child(1) { background-image: url('./IMG_2998.png'); }
        .gallery-item:nth-child(2) { background-image: url('./IMG_3130.png'); }
        .gallery-item:nth-child(3) { background-image: url('./IMG_3005.jpeg'); }
        .gallery-item:nth-child(4) { background-image: url('./live_photo_paired_photo_7DC55377-BAE2-46A1-B34E-75E50049056F.jpeg'); }

        /* 页脚 */
        footer {
            padding: 40px 0;
            text-align: center;
            color: var(--text-gray);
            font-size: 0.85rem;
            border-top: 1px solid var(--glass-border);
            margin-top: 60px;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .bento-col-6 { grid-column: span 12; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .hero-img { height: 260px; }
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav>
        <ul>
            <li><a href="#home">首页</a></li>
            <li><a href="#story">相伴故事</a></li>
            <li><a href="#gallery">温馨瞬间</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- 首屏区块 -->
        <header id="home" class="hero">
            <h1>安怡宝宝，生日快乐</h1>
            <p>新的一岁，满载着爱与温暖</p>
            <div class="hero-img"></div>
        </header>

        <!-- Bento 紧凑图文区 -->
        <section id="story" class="bento-grid">
            <div class="bento-card bento-col-6">
                <h2>最爱的小猫</h2>
                <p>馋馋的守护，从你们第一次相遇起，馋馋就一直在注视着你的成长。你们分享时间，分享欢乐，也分享彼此最纯粹的爱意</p>
                <div style="margin-top: 20px;" class="media-box img-cat-bg"></div>
            </div>
            <div class="bento-card bento-col-6">
                <h2>满分可爱，不止一面</h2>
                <p>你的每一个微笑、每一次关心，都是生命赠予我的珍贵礼物</p>
                <div style="margin-top: 20px;" class="media-box img-baby-bg"></div>
            </div>
        </section>

        <!-- 照片墙网格 -->
        <section id="gallery" class="gallery-section">
            <h2>the moment</h2>
            <div class="gallery-grid">
                <div class="gallery-item"></div>
                <div class="gallery-item"></div>
                <div class="gallery-item"></div>
                <div class="gallery-item"></div>
            </div>
        </section>
    </div>

    <!-- 底部 -->
    <footer>
        <p>Candy© 2026 为安怡宝宝专属定制</p>
        <p>愿你的世界永远充满幸福与小猫的叫声</p>
    </footer>

</body>
</html>
