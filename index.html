          /* ==============================================
   苹果官网级高级感 CSS 核心模块
   ============================================== */

/* 1. 全局定义苹果官方 Spring 弹簧曲线 & 细边框 */
:root {
    --hairline-border: rgba(229, 164, 181, 0.22);
    --apple-ease: cubic-bezier(0.16, 1, 0.3, 1); /* 苹果官方物理弹簧动效 */
}

/* 2. macOS 风格背景弥散柔光 (Ambient Radial Glow) */
.ambient-glow {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 0; overflow: hidden;
}
.glow-blob-1 {
    position: absolute; top: -10%; right: -10%; width: 50vw; height: 50vw;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(253, 226, 233, 0.6) 0%, rgba(253, 242, 245, 0) 70%);
    filter: blur(80px);
    animation: floatGlow 18s ease-in-out infinite alternate;
}
.glow-blob-2 {
    position: absolute; bottom: 10%; left: -10%; width: 60vw; height: 60vw;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245, 210, 220, 0.4) 0%, rgba(253, 242, 245, 0) 70%);
    filter: blur(100px);
    animation: floatGlow 22s ease-in-out infinite alternate-reverse;
}
@keyframes floatGlow {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-50px, 60px) scale(1.1); }
}

/* 3. 苹果玻璃面板划过扫光 (给任意卡片加上 class="shine-effect" 即可启用) */
.shine-effect { position: relative; overflow: hidden; }
.shine-effect::after {
    content: '';
    position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.25) 50%, transparent 70%);
    transform: rotate(30deg) translateY(-100%);
    transition: transform 0.9s var(--apple-ease);
    pointer-events: none;
}
.shine-effect:hover::after {
    transform: rotate(30deg) translateY(100%);
}

/* 4. Apple Bento Grid（便当盒网格布局） */
.bento-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 24px;
}
.bento-card {
    position: relative;
    border-radius: 28px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 12px 30px rgba(0,0,0,0.04), 0 0 0 1px var(--hairline-border);
    transition: transform 0.5s var(--apple-ease), box-shadow 0.5s var(--apple-ease);
    min-height: 380px;
}
.bento-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 24px 50px rgba(229, 164, 181, 0.28);
}
.bento-col-7 { grid-column: span 7; }
.bento-col-5 { grid-column: span 5; }
.bento-col-12 { grid-column: span 12; }

.bento-bg {
    width: 100%; height: 100%;
    background-position: center; background-size: cover;
    transition: transform 0.8s var(--apple-ease);
}
.bento-card:hover .bento-bg { transform: scale(1.04); }

.bento-info {
    position: absolute; bottom: 0; left: 0; width: 100%;
    padding: 25px 30px; box-sizing: border-box;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.55) 100%);
    color: #ffffff; text-align: left;
    backdrop-filter: blur(4px);
}

/* 5. 全局微粒动画样式 */
.click-sparkle {
    position: fixed; pointer-events: none; font-size: 1.2rem; z-index: 9999;
    animation: sparkleFade 1s var(--apple-ease) forwards;
}
@keyframes sparkleFade {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, -100px) scale(1.5) rotate(45deg); }
}

@media (max-width: 768px) {
    .bento-col-7, .bento-col-5, .bento-col-12 { grid-column: span 12; }
}
     /* ==============================================
   苹果官网级 - 更多高级感细节样式
   ============================================== */

/* 1. 顶部微光滚动进度条 (Scroll Progress Bar) */
.scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    width: 0%;
    background: linear-gradient(90deg, #e5a4b5, #d88ea4, #f5c2d0);
    z-index: 10000;
    box-shadow: 0 0 10px rgba(229, 164, 181, 0.7);
    transition: width 0.1s cubic-bezier(0.16, 1, 0.3, 1);
}

/* 2. 标题金属流光高光 (Shimmer Text Effect) */
/* (给需要高光的标题加上 class="shimmer-text" 即可) */
.shimmer-text {
    background: linear-gradient(
        120deg, 
        #1d1d1f 20%, 
        #e5a4b5 40%, 
        #ffffff 50%, 
        #e5a4b5 60%, 
        #1d1d1f 80%
    );
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textShimmer 6s infinite linear;
}

@keyframes textShimmer {
    0% { background-position: 200% center; }
    100% { background-position: -200% center; }
}

/* 3. 苹果 TV 风格 3D 磁性卡片容器 */
/* (给任何卡片加上 class="tilt-card" 即可开启 3D 视角) */
.tilt-card {
    transform-style: preserve-3d;
    perspective: 1000px;
    will-change: transform;
    transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}

.tilt-card-content {
    transform: translateZ(20px); /* 让卡片内部文字产生 3D 悬浮深度 */
    transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}

/* 4. 苹果灵动跟随光圈 (Apple Fluid Cursor) */
.custom-cursor {
    position: fixed;
    width: 24px;
    height: 24px;
    border: 1.5px solid rgba(229, 164, 181, 0.6);
    background: rgba(253, 242, 245, 0.25);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    backdrop-filter: blur(2px);
    transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                height 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                background 0.25s ease, 
                border-color 0.25s ease;
}

/* 当鼠标悬停在按钮/可点击元素上时，光圈放大吸附 */
body:has(a:hover, button:hover, .tilt-card:hover, .game-item:hover) .custom-cursor {
    width: 48px;
    height: 48px;
    background: rgba(229, 164, 181, 0.15);
    border-color: rgba(216, 142, 164, 0.8);
}

/* 5. 高高奢拟物微噪点背景蒙版 (消除渐变色彩断层，增加高级纸感/磨砂质感) */
body::after {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    opacity: 0.025;
    pointer-events: none;
    z-index: 9998;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}
    </style>

    <!-- JS：实现滚动渐显动画 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const reveals = document.querySelectorAll('.reveal');
            
            const revealOptions = {
                threshold: 0.15,
                rootMargin: "0px 0px -50px 0px"
            };

            const revealOnScroll = new IntersectionObserver(function(entries, observer) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target); // 动画只播放一次
                    }
                });
            }, revealOptions);

            reveals.forEach(reveal => {
                revealOnScroll.observe(reveal);
            });
        });
     // 互动小游戏逻辑
        let score = 0;
        let timeLeft = 20;
        let gameTimer = null;
        let spawnInterval = null;
        const emojis = ['🐟', '💖', '🎂', '🐾', '🐱', '✨'];

        function startGame() {
            score = 0;
            timeLeft = 20;
            document.getElementById('game-score').innerText = score;
            document.getElementById('game-timer').innerText = timeLeft;
            document.getElementById('game-overlay').style.display = 'none';

            const area = document.getElementById('game-area');
            const items = area.querySelectorAll('.game-item');
            items.forEach(item => item.remove());

            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('game-timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            spawnItem();
            spawnInterval = setInterval(spawnItem, 600);
        }

        function spawnItem() {
            const area = document.getElementById('game-area');
            if (!area || timeLeft <= 0) return;

            const item = document.createElement('div');
            item.className = 'game-item';
            item.innerText = emojis[Math.floor(Math.random() * emojis.length)];

            const x = Math.random() * (area.clientWidth - 50);
            const y = Math.random() * (area.clientHeight - 50);
            item.style.left = x + 'px';
            item.style.top = y + 'px';

            item.onclick = function() {
                score += 10;
                document.getElementById('game-score').innerText = score;
                item.remove();
            };

            area.appendChild(item);

            setTimeout(() => {
                if (item.parentNode) {
                    item.remove();
                }
            }, 1500);
        }

        function endGame() {
            clearInterval(gameTimer);
            clearInterval(spawnInterval);

            const overlay = document.getElementById('game-overlay');
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('overlay-desc');

            title.innerText = "🎉 游戏结束！";
            desc.innerText = `太棒啦！你一共获得了 ${score} 分！获得成就：【安怡宝宝最棒啦】！`;
            
            overlay.querySelector('button').innerText = "再玩一次";
            overlay.style.display = 'flex';
        }

// 1. 顶部柔光滚动进度条计算
window.addEventListener('scroll', function() {
    const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const scrolled = (winScroll / height) * 100;
    const progressBar = document.getElementById('scroll-progress');
    if (progressBar) {
        progressBar.style.width = scrolled + '%';
    }
});

// 2. 苹果灵动光圈指针平滑跟手指/鼠标 (Linear Interpolation)
let mouseX = 0, mouseY = 0;
let cursorX = 0, cursorY = 0;

document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

function animateCursor() {
    // 缓动插值算法，产生平滑跟进的灵动质感
    cursorX += (mouseX - cursorX) * 0.18;
    cursorY += (mouseY - cursorY) * 0.18;

    const cursor = document.getElementById('custom-cursor');
    if (cursor) {
        cursor.style.left = cursorX + 'px';
        cursor.style.top = cursorY + 'px';
    }
    requestAnimationFrame(animateCursor);
}
animateCursor();

// 3. Apple TV 风格 3D 磁性卡片倾斜效果 (3D Tilt Card)
document.querySelectorAll('.tilt-card').forEach(card => {
    card.addEventListener('mousemove', function(e) {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left; // 鼠标相对卡片的 X 坐标
        const y = e.clientY - rect.top;  // 鼠标相对卡片的 Y 坐标
        
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        // 计算倾斜角度（限制在 -10deg 到 10deg 之间）
        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
    });

    card.addEventListener('mouseleave', function() {
        // 鼠标离开时自动弹簧归位
        card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
    });
});
