<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>安怡宝宝的暹罗猫生日冒险</title>
  <style>
    :root{
      --ink:#5e274a; --pink:#f56caf; --rose:#ffb9d8; --lav:#d9c3ff;
      --cream:#fffafc; --gold:#f8cc75; --glass:rgba(255,255,255,.72);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--ink);
      font-family:ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(circle at 14% 15%,#fff 0 2px,transparent 3px) 0 0/45px 45px,
        radial-gradient(circle at 83% 70%,#fff 0 1px,transparent 2px) 0 0/32px 32px,
        linear-gradient(135deg,#ffd9e9 0%,#f5dcff 48%,#dbeeff 100%);
    }
    body::before{
      content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
      background:radial-gradient(circle at 20% 80%,#ff9dcc 0 2px,transparent 3px) 0 0/75px 75px;
    }
    button{
      border:0; cursor:pointer; font:inherit; color:var(--ink);
      transition:transform .2s,filter .2s,box-shadow .2s;
    }
    button:hover{transform:translateY(-3px);filter:brightness(1.04)}
    button:active{transform:scale(.96)}
    #app{position:relative; z-index:1}
    .hud{
      position:sticky; top:12px; z-index:10; width:min(1100px,calc(100% - 28px));
      margin:12px auto 0; padding:11px 14px; display:flex; align-items:center;
      justify-content:space-between; gap:10px; border:1px solid #fff;
      border-radius:22px; background:rgba(255,255,255,.82); backdrop-filter:blur(18px);
      box-shadow:0 10px 35px rgba(167,65,117,.16);
    }
    .brand{padding:7px 8px;background:transparent;font-weight:900;letter-spacing:.02em}
    .hud-middle{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:800}
    .hud-control{padding:8px 10px;border-radius:13px;background:#ffe2ef}
    .shell{width:min(1000px,calc(100% - 28px));margin:26px auto 52px}
    .panel{
      min-height:570px; overflow:hidden; padding:clamp(24px,6vw,65px);
      border:1px solid rgba(255,255,255,.86); border-radius:34px; background:var(--glass);
      box-shadow:0 25px 75px rgba(160,63,112,.19); backdrop-filter:blur(16px);
      animation:appear .45s ease both;
    }
    @keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .eyebrow{margin:0 0 8px;color:#ed5ba3;font-weight:900;font-size:12px;letter-spacing:.15em}
    h1{margin:10px 0 15px;font-size:clamp(38px,7vw,76px);line-height:.98;letter-spacing:-.075em}
    h2{margin:8px 0 12px;font-size:clamp(28px,4vw,42px);letter-spacing:-.04em}
    h3{font-size:20px}
    p{line-height:1.75}
    .muted{color:#995d80}
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:8px; margin:8px 4px;
      padding:14px 20px; border-radius:999px; color:#fff; font-weight:900;
      background:linear-gradient(135deg,#fa65ad,#ba72e7); box-shadow:0 10px 20px #ea8fbd72;
    }
    .btn-light{color:#91456e;background:#fff;box-shadow:0 8px 20px #b35d8840}
    .btn-gold{color:#845f18;background:linear-gradient(135deg,#fff0ad,#f8c765)}
    .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:25px;align-items:center}
    .hero-copy{position:relative;z-index:1}
    .hero-art{
      min-height:420px; display:grid; place-items:center; position:relative; overflow:hidden;
      border-radius:28px; background:
      radial-gradient(circle at 48% 42%,rgba(255,255,255,.96),transparent 30%),
      linear-gradient(145deg,#ffc4df,#d9c6ff 55%,#bfe9ff);
    }
    .hero-art::before,.hero-art::after{
      content:"✦";position:absolute;color:white;font-size:35px;animation:twinkle 1.8s infinite alternate
    }
    .hero-art::before{top:15%;left:16%}.hero-art::after{bottom:13%;right:15%;animation-delay:.6s}
    @keyframes twinkle{to{opacity:.3;transform:scale(.5) rotate(45deg)}}
    .cloud{position:absolute;border-radius:999px;background:#fff9;filter:blur(.2px)}
    .cloud.one{width:150px;height:42px;top:18%;right:-22px}.cloud.two{width:110px;height:30px;bottom:20%;left:-13px}
    .siamese{
      position:relative; width:170px; height:190px; filter:drop-shadow(0 20px 16px #7b3c6750);
      animation:catFloat 3s ease-in-out infinite;
    }
    @keyframes catFloat{50%{transform:translateY(-17px) rotate(2deg)}}
    .cat-body{position:absolute;bottom:0;left:31px;width:108px;height:98px;border-radius:57px 57px 34px 34px;background:linear-gradient(135deg,#fff9ef,#e8d5c8)}
    .cat-head{position:absolute;top:25px;left:23px;width:125px;height:110px;border-radius:48% 48% 46% 46%;background:linear-gradient(135deg,#fffdf6,#e9d5c8);z-index:2}
    .ear{position:absolute;top:-27px;width:50px;height:64px;background:#5d3c48;clip-path:polygon(50% 0,100% 100%,0 100%);z-index:1}.ear.left{left:1px;transform:rotate(-17deg)}.ear.right{right:1px;transform:rotate(17deg)}
    .mask{position:absolute;top:38px;left:25px;width:76px;height:45px;border-radius:45%;background:#74505a;opacity:.92}
    .eye{position:absolute;top:54px;width:18px;height:24px;border-radius:50%;background:#6ec8e9;border:3px solid #44303c;z-index:3}.eye.left{left:31px}.eye.right{right:31px}
    .eye::after{content:"";position:absolute;width:4px;height:13px;left:4px;top:3px;border-radius:50%;background:#20212b}
    .nose{position:absolute;top:79px;left:56px;width:13px;height:9px;border-radius:50% 50% 60% 60%;background:#e6819e;z-index:4}
    .mouth{position:absolute;top:88px;left:52px;width:23px;height:13px;border-bottom:2px solid #6d4254;border-radius:0 0 50% 50%;z-index:4}
    .paw{position:absolute;bottom:-3px;width:35px;height:23px;border-radius:50%;background:#5e3d49}.paw.left{left:25px}.paw.right{right:25px}
    .tail{position:absolute;right:-16px;bottom:24px;width:52px;height:95px;border:16px solid #62404a;border-left:0;border-radius:0 65px 65px 0;transform:rotate(-25deg)}
    .tag{position:absolute;bottom:48px;left:73px;z-index:4;width:22px;height:22px;border-radius:50%;background:var(--gold);box-shadow:0 2px 0 #b68b3d}
    .level-map{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:35px}
    .level-card{min-height:125px;padding:16px;text-align:left;border-radius:20px;background:#fff;box-shadow:0 9px 20px #bc658e27}
    .level-card.locked{filter:grayscale(.7);opacity:.55}.level-card strong{display:block;font-size:17px}.level-card span{display:block;margin-top:7px;color:#a56584;font-size:13px}
    .game-top{text-align:center;max-width:640px;margin:auto}.room{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;max-width:670px;margin:30px auto}.room-item{min-height:105px;border-radius:20px;background:#fff;box-shadow:0 8px 19px #b9689130;font-size:38px}.room-item small{display:block;font-size:12px;color:#9c5d7e}
    .notice{max-width:600px;margin:20px auto;padding:13px 17px;border-radius:16px;background:#fff2ae;font-weight:700}.notice.success{background:#d9ffe7}
    .arena{position:relative;height:355px;overflow:hidden;margin:25px auto;border-radius:26px;background:linear-gradient(#bbe9ff,#ffe4f0)}.token{position:absolute;border:0;background:transparent;font-size:34px;animation:tokenBob 1.5s infinite alternate}@keyframes tokenBob{to{transform:translateY(-10px) rotate(8deg)}}
    .scoreline{display:flex;justify-content:center;gap:18px;font-weight:900;font-size:17px}.puzzle{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:415px;margin:25px auto}.piece{aspect-ratio:1;border-radius:18px;color:#fff;font-size:26px;font-weight:900;background:linear-gradient(145deg,#ff8abe,#9c74ef);box-shadow:inset 0 1px 0 #ffffff77}.piece.active{outline:4px solid #ffe981;transform:scale(.93)}
    .answers{display:grid;gap:10px;max-width:580px;margin:25px auto}.answer{padding:16px;border:2px solid #ffd4e7;border-radius:17px;text-align:left;background:#fff}.answer:hover{border-color:#f668ab}.cake{font-size:115px;margin:6px}.candle{font-size:42px;background:transparent;padding:5px}.candle.off{opacity:.35;filter:grayscale(1);transform:translateY(9px)}
    .gift-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;max-width:700px;margin:30px auto}.gift{min-height:150px;border-radius:24px;background:linear-gradient(145deg,#fff,#ffe6f0);font-size:65px;box-shadow:0 12px 22px #bd668c28}.gift.open{background:linear-gradient(145deg,#fff7c8,#ffd372)}
    .gallery{columns:2 190px;gap:15px;margin-top:25px;text-align:left}.photo{position:relative;break-inside:avoid;overflow:hidden;margin-bottom:15px;padding:10px;border-radius:18px;background:#fff;box-shadow:0 9px 23px #b0668b28}.photo img{position:relative;z-index:1;width:100%;height:165px;border-radius:11px;object-fit:cover}.photo .placeholder{position:absolute;inset:10px 10px auto;height:165px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#ffd5e7,#d9c6ff);font-size:48px}.photo p{margin:8px 2px 2px;font-weight:800;font-size:13px}
    .locked-box{max-width:510px;margin:100px auto;text-align:center}.final{position:relative;color:white;background:radial-gradient(circle at top,#ad6ab1,#2c153d 70%)}.final::before{content:"";position:absolute;inset:0;opacity:.7;background-image:radial-gradient(#fff 1px,transparent 2px);background-size:38px 38px}.final>*{position:relative}.final h1{color:#ffe5f1}.final-lines{font-size:18px;line-height:2.1}.secret-paw{position:fixed;right:12px;bottom:12px;z-index:15;opacity:.35;background:transparent;font-size:28px}.secret-door{position:fixed;left:12px;bottom:12px;z-index:15;display:none}
    #toast{position:fixed;left:50%;bottom:27px;z-index:20;opacity:0;transform:translate(-50%,20px);padding:12px 16px;white-space:nowrap;border-radius:999px;color:#fff;background:#61354f;box-shadow:0 10px 30px #4b183944;transition:.28s}.burst{position:fixed;z-index:30;font-size:20px;pointer-events:none;animation:burst .9s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(280deg);opacity:0}}
    @media(max-width:700px){.hero{grid-template-columns:1fr}.hero-art{min-height:300px;order:-1}.level-map{grid-template-columns:repeat(2,1fr)}.room{grid-template-columns:repeat(3,1fr)}.gift-grid{grid-template-columns:repeat(2,1fr)}.hud-middle{font-size:12px}.brand{font-size:13px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast"></div>

  <script>
    const KEY = "anyi-siamese-birthday-v1";
    const order = ["find","heart","puzzle","quiz","cake","gifts"];
    const photoNames = ["初见的可爱","一起散步的午后","甜甜的生日","被温柔照亮","今天也是好天气","小猫的秘密","闪闪发光的你","未完待续"];

    const fresh = () => ({
      page:"home", stars:0, done:[], logoTaps:0, pawTaps:0,
      eggs:{logo:false,keyboard:false,paw:false},
      find:false, heart:{started:false,time:20,score:0,items:[],ended:false},
      puzzle:[8,3,5,1,7,2,9,4,6], selected:null,
      quiz:{index:0,answers:[]}, candles:[true,true,true,true,true],
      gifts:[], opened:""
    });

    let game;
    try { game = JSON.parse(localStorage.getItem(KEY)) || fresh(); }
    catch { game = fresh(); }

    let heartTimer = null;
    let typed = "";
    let music = null;
    const app = document.getElementById("app");
    const toastNode = document.getElementById("toast");

    function save(){ localStorage.setItem(KEY, JSON.stringify(game)); }
    function done(id){ return game.done.includes(id); }
    function unlocked(id){ return order.indexOf(id) <= game.done.length; }
    function cat(){ return `<div class="siamese"><div class="tail"></div><div class="cat-body"></div><div class="paw left"></div><div class="paw right"></div><div class="cat-head"><div class="ear left"></div><div class="ear right"></div><div class="mask"></div><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div></div><div class="tag"></div></div>`; }

    function shell(content, extra=""){
      const allEggs = Object.values(game.eggs).every(Boolean);
      app.innerHTML = `
        <header class="hud">
          <button class="brand" onclick="tapLogo()">🐾 安怡宝宝的生日冒险</button>
          <div class="hud-middle"><span>⭐ ${game.stars}</span><span>🎁 ${game.gifts.length}</span><span>关卡 ${Math.min(game.done.length + 1, 6)}/6</span></div>
          <button class="hud-control" onclick="toggleMusic()">🎵 音乐</button>
        </header>
        <div class="shell">
          <section class="panel ${extra}">${content}</section>
        </div>
        <button class="secret-paw" onclick="tapPaw()" title="隐藏猫爪">🐾</button>
        <button class="secret-door btn btn-gold" style="display:${allEggs ? "inline-flex" : "none"}" onclick="go('secret')">进入秘密猫屋 🐱</button>`;
    }

    function go(page){
      clearHeartTimer();
      game.page = page;
      save();
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    function complete(id,next){
      if(!done(id)){ game.done.push(id); game.stars++; save(); }
      go(next);
      setTimeout(celebrate,180);
    }

    function render(){
      const p = game.page;

      if(p === "home"){
        shell(`
          <div class="hero">
            <div class="hero-copy">
              <p class="eyebrow">SIAMESE CAT BIRTHDAY WONDERLAND</p>
              <h1>安怡宝宝，<br>生日快乐。</h1>
              <p class="muted">一场由暹罗小猫守护、只属于你的粉色生日冒险。</p>
              <button class="btn" onclick="go('find')">开始冒险 <span>→</span></button>
              <button class="btn btn-light" onclick="go('map')">查看冒险地图</button>
              <p class="muted" style="font-size:13px">隐藏彩蛋：连续点击标题、输入 AN YI、寻找右下角猫爪。</p>
            </div>
            <div class="hero-art">
              <div class="cloud one"></div><div class="cloud two"></div>
              ${cat()}
            </div>
          </div>
          <div class="level-map">
            ${order.map((id,i)=>`<button class="level-card ${unlocked(id) ? "" : "locked"}" onclick="openLevel('${id}')">
              <strong>LEVEL ${String(i+1).padStart(2,"0")}</strong>
              <span>${["寻找暹罗猫","收集心动","回忆拼图","生日问答","许愿蜡烛","礼物房间"][i]}</span>
            </button>`).join("")}
          </div>`);
      }

      if(p === "map"){
        shell(`<p class="eyebrow">ADVENTURE MAP</p><h2>安怡宝宝的生日地图</h2><p class="muted">完成小游戏即可获得星星，并解锁下一段惊喜。</p><div class="level-map">
        ${order.map((id,i)=>`<button class="level-card ${unlocked(id) ? "" : "locked"}" onclick="openLevel('${id}')"><strong>${done(id) ? "✓" : "○"} LEVEL ${String(i+1).padStart(2,"0")}</strong><span>${["暹罗猫的房间","心动花园","回忆画框","星月问答","生日蛋糕","惊喜礼物"][i]}</span></button>`).join("")}
        </div><button class="btn btn-light" onclick="go('home')">回到首页</button>`);
      }

      if(p === "find"){
        shell(`<div class="game-top"><p class="eyebrow">LEVEL 01</p><h2>寻找暹罗小猫</h2><p class="muted" id="findTip">${game.find ? "你找到她啦！小猫正在等安怡宝宝抱抱。🐾" : "小猫躲进了粉色房间。点击物品寻找她吧。"} </p></div>
          <div class="room">
            ${[
              ["pillow","🛏️","云朵枕头"],["flower","🌸","樱花花瓶"],["gift","🎁","礼物盒"],
              ["mirror","🪞","月亮镜子"],["bear","🧸","小熊玩偶"],["window","🪟","窗边"],
              ["ball","🧶","毛线球"],["cat","🐱","暹罗小猫"]
            ].map(([id,icon,label])=>`<button class="room-item" onclick="searchRoom('${id}')">${icon}<small>${label}</small></button>`).join("")}
          </div>
          ${game.find ? `<div class="notice success">“生日快乐，安怡宝宝！接下来一起收集好多好多喜欢。”</div><button class="btn" onclick="complete('find','heart')">获得第一颗星星 ⭐</button>` : ""}`);
      }

      if(p === "heart"){
        const h = game.heart;
        shell(`<div class="game-top"><p class="eyebrow">LEVEL 02</p><h2>心动花园</h2><p class="muted">20 秒内收集 15 分：💗 +1、⭐ +2、💣 -2。</p>
        <div class="scoreline"><span>⏳ ${h.time}s</span><span>💗 ${h.score}/15</span></div></div>
        ${!h.started && !h.ended ? `<button class="btn" onclick="startHeart()">开始收集</button>` : ""}
        ${h.started ? `<div class="arena">${h.items.map(x=>`<button class="token" style="left:${x.x}%;top:${x.y}%;" onclick="catchToken('${x.id}')">${x.icon}</button>`).join("")}</div>` : ""}
        ${h.ended ? (h.score >= 15
          ? `<div class="notice success">安怡宝宝收集到了好多好多心动！</div><button class="btn" onclick="complete('heart','puzzle')">获得星星，继续冒险 →</button>`
          : `<div class="notice">差一点点，再试一次吧！</div><button class="btn" onclick="resetHeart()">重新开始</button>`) : ""}`);
      }

      if(p === "puzzle"){
        const solved = game.puzzle.every((n,i)=>n === i+1);
        shell(`<div class="game-top"><p class="eyebrow">LEVEL 03</p><h2>回忆拼图</h2><p class="muted">依次点击两块数字交换位置，把 1 到 9 排整齐。</p></div>
          <div class="puzzle">${game.puzzle.map((n,i)=>`<button class="piece ${game.selected === i ? "active" : ""}" onclick="tapPiece(${i})">${n}</button>`).join("")}</div>
          ${solved ? `<div class="notice success">原来，最珍贵的礼物，是一起留下的回忆。</div><button class="btn" onclick="complete('puzzle','quiz')">获得星星，继续冒险 →</button>` : `<button class="btn btn-light" onclick="shufflePuzzle()">重新洗牌</button>`}`);
      }

      if(p === "quiz"){
        const q = [
          ["如果今天可以去一个地方，你想去哪里？",["海边","游乐园","有猫的咖啡馆","说走就走"]],
          ["哪一种小猫最可爱？",["暹罗猫","布偶猫","橘猫","所有小猫"]],
          ["生日最想收到什么？",["一束花","一个拥抱","一块蛋糕","温柔的一天"]]
        ];
        if(game.quiz.index < q.length){
          const current = q[game.quiz.index];
          shell(`<div class="game-top"><p class="eyebrow">LEVEL 04 · ${game.quiz.index+1}/3</p><h2>星月生日问答</h2><h3>${current[0]}</h3></div>
          <div class="answers">${current[1].map(answer=>`<button class="answer" onclick="answerQuiz('${answer}')">${answer}</button>`).join("")}</div>`);
        } else {
          shell(`<div class="game-top">${cat()}<p class="eyebrow">LEVEL 04 COMPLETE</p><h2>安怡宝宝的生日性格卡</h2>
          <div class="notice success">🌸 温柔指数：98%<br>🐱 猫咪亲和力：100%<br>💗 可爱指数：99%<br>✨ 幸运值：∞</div>
          <p>小猫说：你的每一个答案都好可爱！</p><button class="btn" onclick="complete('quiz','cake')">获得星星，继续冒险 →</button></div>`);
        }
      }

      if(p === "cake"){
        const off = game.candles.every(v=>!v);
        shell(`<div class="game-top"><p class="eyebrow">LEVEL 05</p><h2>许愿蜡烛</h2><p class="muted">${off ? "现在，可以许愿啦。闭上眼睛三秒钟。": "点击所有蜡烛，把生日愿望轻轻吹亮。"}</p>
        <div class="cake">🎂</div><div>${game.candles.map((on,i)=>`<button class="candle ${on ? "" : "off"}" onclick="blowCandle(${i})">${on ? "🕯️" : "💨"}</button>`).join("")}</div>
        ${off ? `<div class="notice success">✨ 愿安怡宝宝的每一个愿望，都被温柔实现。✨</div><button class="btn" onclick="complete('cake','gifts')">获得星星，打开礼物房间 →</button>` : ""}</div>`);
      }

      if(p === "gifts"){
        const boxes = [
          ["hug","🎁","一个隔空拥抱：愿安怡宝宝永远被认真爱着。"],
          ["album","🎀","回忆相册已解锁，去放进你们珍贵的照片吧。"],
          ["wish","💌","愿你每天都有小惊喜，也有大快乐。"],
          ["secret","✨","神秘礼物：最终生日祝福已经准备好了。"]
        ];
        shell(`<div class="game-top"><p class="eyebrow">LEVEL 06</p><h2>月光礼物房间</h2><p class="muted">每一份礼物，都藏着一句想对安怡宝宝说的话。</p></div>
          <div class="gift-grid">${boxes.map(([id,icon,text])=>`<button class="gift ${game.gifts.includes(id) ? "open" : ""}" onclick="openGift('${id}','${text}')">${game.gifts.includes(id) ? "💝" : icon}</button>`).join("")}</div>
          ${game.opened ? `<div class="notice success">${game.opened}</div>` : ""}
          ${game.gifts.includes("album") ? `<button class="btn btn-light" onclick="go('gallery')">查看回忆相册 📸</button>` : ""}
          ${game.gifts.includes("secret") ? `<button class="btn" onclick="openFinal()">打开最终惊喜 💗</button>` : ""}`);
      }

      if(p === "gallery"){
        shell(`<div class="game-top"><p class="eyebrow">MEMORY ALBUM</p><h2>安怡宝宝的回忆相册</h2><p class="muted">把照片放到 <code>images/photo1.jpg</code> 至 <code>images/photo8.jpg</code>，会自动替换占位图。</p></div>
          <div class="gallery">${photoNames.map((name,i)=>`<div class="photo"><div class="placeholder">${["🌸","🐱","🎂","💗"][i%4]}</div><img src="images/photo${i+1}.jpg" alt="${name}" onerror="this.style.display='none'"><p>${name}</p></div>`).join("")}</div>
          <button class="btn" onclick="go('gifts')">回到礼物房间</button>`);
      }

      if(p === "secret"){
        shell(`<div class="game-top">${cat()}<p class="eyebrow">SECRET SIAMESE ROOM</p><h2>你发现我啦！</h2><p class="muted">暹罗小猫把三份隐藏心意都交给了你：<br>愿安怡宝宝永远被喜欢的人、好天气和闪闪发光的自己包围。</p><button class="btn" onclick="go('home')">回到冒险地图</button></div>`);
      }

      if(p === "final"){
        const ready = order.every(done);
        if(!ready){
          shell(`<div class="locked-box"><div style="font-size:75px">🔒</div><h2>最终惊喜还在等待</h2><p class="muted">先完成所有生日冒险，暹罗小猫才会打开这扇门哦。</p><button class="btn" onclick="go('map')">回到冒险地图</button></div>`);
        } else {
          shell(`<div class="game-top">${cat()}<p class="eyebrow">FOR ANYI</p><h1>安怡宝宝，<br>生日快乐！</h1>
          <div class="final-lines"><p>愿你新的一岁，有很多很多开心。</p><p>有喜欢的人和事，有值得期待的明天。</p><p>有好多好多温柔的瞬间。</p><p><b>也希望每一个普通的日子，都有人认真地爱着你。</b></p></div>
          <button class="btn btn-gold" onclick="restart()">重新开始冒险 ↻</button></div>`, "final");
        }
      }
    }

    function openLevel(id){ if(!unlocked(id)) return notify("先完成前面的冒险哦～"); go(id); }
    function searchRoom(id){
      if(id === "cat"){ game.find = true; save(); notify("找到暹罗小猫啦！🐱"); render(); }
      else notify(["不是这里喵～","小猫留下了一点香味…","再找找看吧 🐾"][Math.floor(Math.random()*3)]);
    }

    function startHeart(){
      clearHeartTimer();
      game.heart = {
        started:true,time:20,score:0,ended:false,
        items:Array.from({length:20},(_,i)=>({
          id:"t"+i, x:Math.floor(Math.random()*84)+3, y:Math.floor(Math.random()*76)+5,
          icon:Math.random()<.12 ? "💣" : Math.random()<.23 ? "⭐" : Math.random()<.38 ? "💖" : "💗"
        }))
      };
      save(); render();
      heartTimer = setInterval(()=>{
        game.heart.time--;
        if(game.heart.time <= 0){game.heart.time=0;game.heart.started=false;game.heart.ended=true;clearHeartTimer();}
        save(); render();
      },1000);
    }

    function clearHeartTimer(){ if(heartTimer){clearInterval(heartTimer);heartTimer=null;} }
    function resetHeart(){ game.heart={started:false,time:20,score:0,items:[],ended:false};save();render(); }
    function catchToken(id){
      const item=game.heart.items.find(x=>x.id===id); if(!item)return;
      const points=item.icon==="💣"?-2:item.icon==="⭐"?2:item.icon==="💖"?3:1;
      game.heart.score=Math.max(0,game.heart.score+points);
      game.heart.items=game.heart.items.filter(x=>x.id!==id);
      if(game.heart.score>=15){game.heart.started=false;game.heart.ended=true;clearHeartTimer();notify("心动收集完成！");}
      save();render();
    }

    function tapPiece(index){
      if(game.selected===null) game.selected=index;
      else{
        [game.puzzle[game.selected],game.puzzle[index]]=[game.puzzle[index],game.puzzle[game.selected]];
        game.selected=null;
      }
      save();render();
    }
    function shufflePuzzle(){game.puzzle=[8,3,5,1,7,2,9,4,6];game.selected=null;save();render();}
    function answerQuiz(answer){game.quiz.answers.push(answer);game.quiz.index++;save();notify("暹罗小猫记住你的答案啦～");render();}
    function blowCandle(index){game.candles[index]=false;save();render();}
    function openGift(id,text){if(!game.gifts.includes(id))game.gifts.push(id);game.opened=text;save();notify("礼物已打开 ✨");render();}
    function openFinal(){if(!done("gifts")){game.done.push("gifts");game.stars++;save();}go("final");setTimeout(celebrate,180);}

    function tapLogo(){game.logoTaps++;if(game.logoTaps>=7){game.eggs.logo=true;notify("你听到了暹罗小猫的轻呼…");}save();render();}
    function tapPaw(){game.pawTaps++;if(game.pawTaps>=5){game.eggs.paw=true;notify("猫爪彩蛋已发现！");}save();render();}

    window.addEventListener("keydown",e=>{
      typed=(typed+e.key.toLowerCase()).slice(-4);
      if(typed==="anyi"){game.eggs.keyboard=true;save();notify("密码正确：欢迎进入小猫的秘密。");render();}
    });

    function toggleMusic(){
      if(!music)music=new Audio("sounds/birthday.mp3");
      if(music.paused)music.play().then(()=>notify("音乐已播放 🎵")).catch(()=>notify("请把音乐放到 sounds/birthday.mp3"));
      else{music.pause();notify("音乐已暂停");}
    }
    function notify(message){
      toastNode.textContent=message;toastNode.style.opacity=1;toastNode.style.transform="translate(-50%,0)";
      clearTimeout(notify.timer);notify.timer=setTimeout(()=>{toastNode.style.opacity=0;toastNode.style.transform="translate(-50%,20px)"},1900);
    }
    function celebrate(){
      const icons=["⭐","💗","✨","🌸","🐾"];
      for(let i=0;i<28;i++){
        const el=document.createElement("span");el.className="burst";el.textContent=icons[i%icons.length];
        el.style.left="50%";el.style.top="45%";el.style.setProperty("--x",(Math.random()*520-260)+"px");el.style.setProperty("--y",(Math.random()*500-250)+"px");
        document.body.appendChild(el);setTimeout(()=>el.remove(),950);
      }
    }
    function restart(){if(confirm("确定重新开始这场生日冒险吗？")){clearHeartTimer();game=fresh();save();render();}}
    render();
  </script>
</body>
</html>
