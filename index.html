<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>安怡的生日小猫冒险</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #82385f;
      font-family: Arial, "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #ffd6e9, #f5dfff, #dceeff);
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; background: #ffffffdd; box-shadow: 0 3px 16px #c56e9b44;
    }
    button {
      border: 0; border-radius: 16px; padding: 12px 16px;
      cursor: pointer; color: #82385f; font-size: 16px;
    }
    .main {
      max-width: 760px; min-height: 520px; margin: 38px auto; padding: 36px 22px;
      text-align: center; background: #ffffffdd; border-radius: 30px;
      box-shadow: 0 18px 50px #b76a9555;
    }
    .cat { font-size: 110px; animation: float 2s infinite alternate; }
    .primary { margin: 16px 4px; color: white; font-weight: bold; background: linear-gradient(135deg, #fa5ba8, #bd69e8); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 25px auto; max-width: 560px; }
    .item { min-height: 105px; font-size: 42px; background: white; box-shadow: 0 5px 14px #d684ae44; }
    .heart-area { min-height: 250px; padding: 18px; border-radius: 22px; background: linear-gradient(#c9edff, #ffe3f0); }
    .heart { font-size: 34px; margin: 8px; background: transparent; animation: float 1s infinite alternate; }
    .answers { display: grid; gap: 10px; max-width: 450px; margin: 25px auto; }
    .answers button { background: white; border: 2px solid #ffc4df; }
    .photos { columns: 2 160px; gap: 12px; margin-top: 24px; text-align: left; }
    .photo { break-inside: avoid; margin-bottom: 12px; padding: 9px; background: white; border-radius: 16px; }
    .photo img { width: 100%; height: 125px; border-radius: 10px; object-fit: cover; background: #ffd8e9; }
    .photo p { margin: 8px 3px 2px; }
    #secret { display: none; position: fixed; right: 18px; bottom: 18px; background: #ffe48a; }
    @keyframes float { to { transform: translateY(-12px) rotate(3deg); } }
    @media (max-width: 500px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header>
    <button onclick="tapLogo()">🐾 安怡的生日冒险</button>
    <strong id="score">⭐ 0</strong>
    <button onclick="music()">🎵 音乐</button>
  </header>

  <button id="secret" onclick="secretRoom()">🐱 发现隐藏猫咪！</button>
  <main class="main" id="app"></main>

  <script>
    let stars = 0, logoClicks = 0, hearts = 12, audio;

    function updateScore() {
      document.getElementById("score").textContent = "⭐ " + stars;
    }

    function tapLogo() {
      logoClicks++;
      if (logoClicks >= 5) document.getElementById("secret").style.display = "block";
    }

    function music() {
      if (!audio) audio = new Audio("sounds/birthday.mp3");
      audio.paused ? audio.play().catch(() => alert("请把音乐放到 sounds/birthday.mp3")) : audio.pause();
    }

    function home() {
      app.innerHTML = `
        <div class="cat">🐱</div>
        <p>WELCOME TO THE BIRTHDAY WONDERLAND</p>
        <h1>安怡，欢迎来到<br>你的生日世界 💗</h1>
        <p>今天的主角是——陈 · 安 · 怡</p>
        <button class="primary" onclick="findCat()">开始生日冒险 →</button>`;
    }

    function findCat() {
      const items = ["🎁", "🌸", "🧸", "🪟", "🪑", "🐱"];
      app.innerHTML = `
        <p>LEVEL 01</p><h2>寻找迷路的小猫 🐱</h2>
        <p id="tip">点击房间里的物品，找到小猫！</p>
        <div class="grid">
          ${items.map(x => `<button class="item" onclick="checkCat('${x}')">${x}</button>`).join("")}
        </div>`;
    }

    function checkCat(item) {
      if (item !== "🐱") {
        document.getElementById("tip").textContent = "不是这里喵～🐾";
        return;
      }
      app.innerHTML += `
        <p>找到我啦！生日快乐安怡～ 💕</p>
        <button class="primary" onclick="stars++; updateScore(); heartGame()">获得星星，下一关 →</button>`;
    }

    function heartGame() {
      app.innerHTML = `
        <p>LEVEL 02</p><h2>收集生日爱心 💗</h2>
        <p>点击完所有爱心即可通关。</p>
        <div class="heart-area" id="heartArea"></div>`;
      renderHearts();
    }

    function renderHearts() {
      const area = document.getElementById("heartArea");
      area.innerHTML = Array.from({ length: hearts }, (_, i) =>
        `<button class="heart" onclick="collectHeart()">💗</button>`
      ).join("");
    }

    function collectHeart() {
      hearts--;
      if (hearts > 0) return renderHearts();

      app.innerHTML += `
        <p>安怡收集到了好多好多爱心！</p>
        <button class="primary" onclick="stars++; updateScore(); quiz()">继续冒险 →</button>`;
    }

    function quiz() {
      app.innerHTML = `
        <p>LEVEL 03</p><h2>生日小问答 💌</h2>
        <h3>安怡今天最该收到什么？</h3>
        <div class="answers">
          <button onclick="gift()">超级大的生日蛋糕</button>
          <button onclick="gift()">很多很多拥抱</button>
          <button onclick="gift()">猫咪陪伴</button>
          <button onclick="gift()">以上全部</button>
        </div>`;
    }

    function gift() {
      stars++;
      updateScore();
      app.innerHTML = `
        <p>LEVEL 04</p><h2>生日礼物房间 🎁</h2>
        <div class="grid">
          <button class="item" onclick="alert('愿安怡每天都开心！')">🎁</button>
          <button class="item" onclick="alert('一个超级大的拥抱！')">🎀</button>
          <button class="item" onclick="alert('生日快乐，永远可爱！')">💌</button>
          <button class="item" onclick="gallery()">📸</button>
        </div>
        <button class="primary" onclick="gallery()">打开回忆相册 →</button>`;
    }

    function gallery() {
      app.innerHTML = `
        <p>MEMORY ALBUM</p><h2>安怡的回忆相册 📸</h2>
        <p>把照片放进 images/photo1.jpg 到 images/photo8.jpg。</p>
        <div class="photos">
          ${Array.from({ length: 8 }, (_, i) => `
            <div class="photo">
              <img src="images/photo${i + 1}.jpg" alt="回忆 ${i + 1}">
              <p>珍贵回忆 ${i + 1} 💗</p>
            </div>`).join("")}
        </div>
        <button class="primary" onclick="final()">打开最终祝福 →</button>`;
    }

    function secretRoom() {
      app.innerHTML = `
        <div class="cat">🐱🐱🐱</div>
        <h2>SECRET CAT ROOM</h2>
        <p>你发现我啦！愿安怡永远被温柔和快乐包围。</p>
        <button class="primary" onclick="home()">回到首页</button>`;
    }

    function final() {
      app.innerHTML = `
        <div class="cat">🐱</div>
        <h1>陈安怡<br>生日快乐！✨</h1>
        <p>愿你新的一岁，有很多很多开心。</p>
        <p>有喜欢的人和事，有值得期待的明天。</p>
        <p>也希望每一个普通的日子，都有人认真地爱着你。</p>
        <button class="primary" onclick="location.reload()">再玩一次 ↻</button>`;
    }

    home();
  </script>
</body>
</html>
